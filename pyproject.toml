[project]
name = "bidcraft"
version = "0.7.0"
description = "投标文件编制系统：招标解析 → 事实台账 → 规则引擎 → 大纲/正文 → 合规核对 → 清单报价 → DOCX/PDF 导出"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary (All Rights Reserved)" }
authors = [{ name = "yaoyongli1974-dotcom" }]
keywords = ["tender", "bid", "bidding", "boq", "docx", "rules-engine", "compliance"]
classifiers = [
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pypdf>=4.2",
  "pdfplumber>=0.11",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/yaoyongli1974-dotcom/BidCraft"
Issues = "https://github.com/yaoyongli1974-dotcom/BidCraft/issues"

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "qrcode[pil]>=7.4",
]
# 测试与静态检查依赖。安装：uv sync --extra dev（或 uv pip install -e '.[dev]'）。
# 版本锁定以仓库根目录 uv.lock 为准；CI 用 `uv sync --frozen` 复现环境。
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "httpx>=0.27",
]
# 桌面客户端已归档（v0.6.3）。以下 extra 仅用于可复现地重建既有产物，不随新功能演进。
# 精确版本以 uv.lock 为准：uv sync --frozen --extra desktop --extra build
desktop = ["qtpy>=2.4", "PySide6>=6.6", "pywebview>=5.1"]
build = ["pyinstaller>=6.6"]

[project.scripts]
bidcraft = "bidcraft.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bidcraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: Typer 的 Option/Argument 默认值必须写在签名里。
# RUF100: 源码保留 `# noqa: BLE001/S112` 作为意图标注（这些规则不在默认 select 内），
#         不因未启用而改写业务文件；如需严格清理再单独启用。
ignore = ["B008", "RUF100"]
