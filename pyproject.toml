[project]
name = "bidcraft"
version = "0.1.0"
description = "弱电行业投标文件生成内核：解析 → 事实台账 → 规则引擎 → 大纲/正文 → 核对 → DOCX"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "BidCraft" }]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pypdf>=4.2",
  "pdfplumber>=0.11",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "cryptography>=42.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "qrcode[pil]>=7.4",
]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
bidcraft = "bidcraft.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bidcraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
