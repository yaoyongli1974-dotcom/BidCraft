name: desktop-release

# 仅手动触发：服务端版本照常提交/打 tag，不再连带构建客户端产物。
# 需要发客户端时，在 Actions → desktop-release → Run workflow 选择 release 分支或 tag。
on:
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: "把安装包附加到 Release（等于恢复对外分发；默认关闭，桌面端已归档）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
      - name: Install Python deps
        run: |
          uv sync --frozen --extra desktop --extra build
      - name: Build desktop bundle
        run: bash packaging/build_pyinstaller.sh
      - name: Install nfpm
        run: |
          curl -sSfL -o nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz
          tar -xzf nfpm.tgz nfpm && sudo mv nfpm /usr/local/bin/
      - name: Build .deb and .rpm
        run: |
          bash packaging/build_deb.sh
          bash packaging/build_rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/*.rpm
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') && inputs.attach_to_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
      - name: Install Python deps
        run: |
          uv sync --frozen --extra desktop --extra build
      - name: Build exe bundle
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') && inputs.attach_to_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
      - name: Install Python deps
        run: |
          uv sync --frozen --extra desktop --extra build
      - name: Build .app
        run: bash packaging/build_macos_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') && inputs.attach_to_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
