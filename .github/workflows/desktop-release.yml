name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
      - name: Install Python deps
        run: |
          uv sync --frozen
          uv pip install pyinstaller pywebview PySide6
      - name: Build desktop bundle
        run: bash packaging/build_pyinstaller.sh
      - name: Install nfpm
        run: |
          curl -sSfL -o nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz
          tar -xzf nfpm.tgz nfpm && sudo mv nfpm /usr/local/bin/
      - name: Build .deb and .rpm
        run: |
          bash packaging/build_deb.sh
          bash packaging/build_rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/*.rpm
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
      - name: Install Python deps
        run: |
          uv sync --frozen
          uv pip install pyinstaller pywebview
      - name: Build exe bundle
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
      - name: Install Python deps
        run: |
          uv sync --frozen
          uv pip install pyinstaller pywebview
      - name: Build .app
        run: bash packaging/build_macos_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
