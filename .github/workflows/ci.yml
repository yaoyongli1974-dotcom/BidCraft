name: CI

on:
  push:
    branches: ["**"]
    # 发版 tag 也跑一遍：在 CI 里校验 tag 与版本号/变更记录一致。
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    name: python (lint + static checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Sync dependencies (locked)
        # api 额外依赖供 tests/test_api*.py 使用；postgres 供 test_postgres_support.py 使用。
        # 缺失 postgres 时该用例会 ModuleNotFoundError（psycopg），不能静默跳过。
        run: uv sync --frozen --python 3.13 --extra api --extra dev --extra postgres

      - name: Environment info
        run: |
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH} image=${ImageOS:-unknown}"
          uv --version
          uv run --frozen python - <<'PY'
          import platform, sqlite3, sys
          import sqlalchemy
          print("python", sys.version.split()[0], "sqlite", sqlite3.sqlite_version)
          print("sqlalchemy", sqlalchemy.__version__, "platform", platform.platform())
          PY

      - name: Lint (ruff)
        run: uv run --frozen ruff check bidcraft tests scripts

      - name: Alembic single-head check
        # 不硬编码 revision 号：扫描版本文件，断言恰好一个 head（无分叉/孤立迁移）。
        run: |
          uv run --frozen python - <<'PY'
          import ast
          from pathlib import Path

          versions = Path("bidcraft/migrations/versions")
          revisions: set[str] = set()
          down_revisions: set[str] = set()
          for file in sorted(versions.glob("*.py")):
              if file.name == "__init__.py":
                  continue
              tree = ast.parse(file.read_text(encoding="utf-8"), filename=str(file))
              for node in tree.body:
                  if not isinstance(node, ast.Assign):
                      continue
                  value = node.value
                  for target in node.targets:
                      if not isinstance(target, ast.Name):
                          continue
                      if target.id == "revision" and isinstance(value, ast.Constant) and isinstance(value.value, str):
                          revisions.add(value.value)
                      elif target.id == "down_revision":
                          if isinstance(value, ast.Constant) and isinstance(value.value, str):
                              down_revisions.add(value.value)
                          elif isinstance(value, (ast.Tuple, ast.List)):
                              for item in value.elts:
                                  if isinstance(item, ast.Constant) and isinstance(item.value, str):
                                      down_revisions.add(item.value)

          assert revisions, "未找到任何 Alembic revision"
          heads = revisions - down_revisions
          assert len(heads) == 1, f"Alembic 必须恰好一个 head，实际为 {sorted(heads)}"
          print(f"Alembic single-head OK: {heads.pop()}")
          PY

      - name: Alembic preflight (offline SQL / bounded scratch check)
        # 不连真实库、不改运行时启动行为：先静态编译并检查每个迁移的 upgrade/downgrade，
        # 再尝试 alembic upgrade head --sql；当前部分历史迁移在 upgrade 里用 inspect(bind)，
        # 离线 MockConnection 不支持，此时退回临时 SQLite 库执行 create_all + stamp + upgrade。
        # 两种路径都不触碰生产数据，且迁移损坏时都会让本步骤失败。
        env:
          BIDCRAFT_HOME: /tmp/bc-stage8-alembic-home
        run: |
          uv run --frozen python - <<'PY'
          import ast
          import contextlib
          import io
          import tempfile
          from pathlib import Path

          from alembic import command
          from alembic.config import Config
          from sqlalchemy import create_engine
          from sqlalchemy.exc import NoInspectionAvailable

          from bidcraft.models import Base

          scratch = Path(tempfile.mkdtemp(prefix="bc-alembic-"))
          versions = Path("bidcraft/migrations/versions")
          files = sorted(p for p in versions.glob("*.py") if p.name != "__init__.py")
          assert files, "未找到 Alembic 迁移文件"
          for file in files:
              source = file.read_text(encoding="utf-8")
              tree = ast.parse(source, filename=str(file))
              compile(source, str(file), "exec")
              functions = {
                  node.name
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              }
              assert {"upgrade", "downgrade"} <= functions, f"{file} 缺少 upgrade/downgrade"

          def scratch_cfg(url: str) -> Config:
              cfg = Config()
              cfg.set_main_option("script_location", str(Path("bidcraft/migrations").resolve()))
              cfg.set_main_option("sqlalchemy.url", url)
              return cfg

          sql = io.StringIO()
          offline_error = None
          try:
              with contextlib.redirect_stdout(sql):
                  command.upgrade(scratch_cfg("sqlite://"), "head", sql=True)
          except NoInspectionAvailable as exc:
              offline_error = exc

          if offline_error is None:
              assert sql.getvalue().strip(), "离线迁移未生成任何 SQL"
              print("Alembic offline SQL preflight OK")
          else:
              # 仅用临时 SQLite 库执行，与生产启动无关；迁移损坏会在这里失败。
              db = scratch / "scratch.db"
              engine = create_engine(f"sqlite:///{db}")
              Base.metadata.create_all(engine)
              cfg = scratch_cfg(f"sqlite:///{db}")
              command.stamp(cfg, "0001_baseline")
              command.upgrade(cfg, "head")
              print("Alembic scratch-DB preflight OK (offline SQL: inspect(bind) unsupported)")
          PY

      - name: Version / tag / changelog consistency
        env:
          CI_GIT_REF: ${{ github.ref }}
        run: |
          uv run --frozen python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          init_text = Path("bidcraft/__init__.py").read_text(encoding="utf-8")
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")

          m_init = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_text, re.M)
          m_py = re.search(r'^version\s*=\s*["\']([^"\']+)["\']', pyproject, re.M)
          assert m_init and m_py, "无法从 bidcraft/__init__.py 或 pyproject.toml 读取版本号"
          v_init, v_py = m_init.group(1), m_py.group(1)
          assert v_init == v_py, f"版本号不一致：__init__.py={v_init}, pyproject.toml={v_py}"

          notes = Path("docs/release-notes") / f"v{v_init}.md"
          assert notes.is_file(), f"缺少发版说明 {notes}"
          assert re.search(rf"^## v{re.escape(v_init)}\b", changelog, re.M), (
              f"CHANGELOG.md 缺少 v{v_init} 条目"
          )

          web_pkg = json.loads(Path("web/package.json").read_text(encoding="utf-8"))
          v_web = web_pkg.get("version")
          assert v_web == v_init, f"Web 版本号不一致：package.json={v_web}, backend=v{v_init}"

          web_lock = json.loads(Path("web/package-lock.json").read_text(encoding="utf-8"))
          lock_root = (web_lock.get("packages") or {}).get("", {})
          assert web_lock.get("version") == v_init and lock_root.get("version") == v_init, (
              f"Web lock 版本号不一致：{web_lock.get('version')} / {lock_root.get('version')}, backend=v{v_init}"
          )

          ref = os.environ.get("CI_GIT_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref[len("refs/tags/"):]
              assert tag == f"v{v_init}", f"tag {tag} 与版本号 v{v_init} 不一致"
              print(f"release tag OK: {tag}")
          print(f"version consistency OK: v{v_init}")
          PY

  python-tests:
    name: python (pytest + regression)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Sync dependencies (locked, with postgres)
        run: uv sync --frozen --python 3.13 --extra api --extra dev --extra postgres

      - name: Environment info
        run: |
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH} image=${ImageOS:-unknown}"
          uv --version
          uv run --frozen python - <<'PY'
          import platform, sqlite3, sys
          import sqlalchemy
          print("python", sys.version.split()[0], "sqlite", sqlite3.sqlite_version)
          print("sqlalchemy", sqlalchemy.__version__, "platform", platform.platform())
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # /health/ready 冒烟要求 web_dist/index.html 存在；web job 的产物不会共享给本 job。
      - name: Build web assets for readiness smoke
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      - name: Test (pytest)
        run: uv run --frozen pytest -q --junitxml=/tmp/pytest-results.xml

      # RC-10：真实/脱敏数据集是可选外部输入，这里只报告状态、不设门禁，
      # 也不把 skip 数量当作失败条件（DATA BLOCKED 时真实件 E2E 明确跳过）。
      - name: Real tender dataset status (non-gating)
        env:
          BIDCRAFT_REAL_TENDER_ROOT: ${{ vars.BIDCRAFT_REAL_TENDER_ROOT || '' }}
        run: |
          uv run --frozen python - <<'PY'
          import os
          from pathlib import Path

          from bidcraft.evaluation.tender_dataset import DEFAULT_ROOT, dataset_status

          root = Path(os.environ.get("BIDCRAFT_REAL_TENDER_ROOT") or DEFAULT_ROOT)
          status = dataset_status(root)
          if status["ready"]:
              print(f"READY (run): {status['files']} annotated real/redacted tender file(s)")
          else:
              print(f"DATA BLOCKED (skip): {status['reason']}")
          PY

      # v0.33.1 Phase 2：检索 qrels 与专家评分同样属于用户提供的外部数据，
      # 只报告状态，不把 DATA BLOCKED 的 skip 当作失败，也不生成假指标。
      - name: Real retrieval qrels status (non-gating)
        env:
          BIDCRAFT_REAL_RETRIEVAL_ROOT: ${{ vars.BIDCRAFT_REAL_RETRIEVAL_ROOT || '' }}
        run: |
          uv run --frozen python - <<'PY'
          import os
          from pathlib import Path

          from bidcraft.evaluation.retrieval_metrics import DEFAULT_ROOT, retrieval_status

          root = Path(os.environ.get("BIDCRAFT_REAL_RETRIEVAL_ROOT") or DEFAULT_ROOT)
          status = retrieval_status(root)
          if status["ready"]:
              print(f"READY (run): {status['queries']} real qrels query/queries")
          else:
              print(f"DATA BLOCKED (skip): {status['reason']}")
          PY

      - name: Real expert ratings status (non-gating)
        env:
          BIDCRAFT_REAL_EXPERT_ROOT: ${{ vars.BIDCRAFT_REAL_EXPERT_ROOT || '' }}
        run: |
          uv run --frozen python - <<'PY'
          import os
          from pathlib import Path

          from bidcraft.evaluation.quality_calibration import DEFAULT_ROOT, expert_status

          root = Path(os.environ.get("BIDCRAFT_REAL_EXPERT_ROOT") or DEFAULT_ROOT)
          status = expert_status(root)
          if status["ready"]:
              print(f"READY (run): {status['pairs']} real expert rating pair(s)")
          else:
              print(f"DATA BLOCKED (skip): {status['reason']}")
          PY

      - name: Calibration regression (synthetic + industry fixtures, baseline gate)
        run: uv run --frozen bidcraft calibrate tests/fixtures/regression --compare-baseline tests/fixtures/regression/baseline.json

      - name: Verdict regression (FAR / confusion matrix / ★ strict)
        run: uv run --frozen pytest -q tests/test_calibration.py

      # 恢复演练是 opt-in：未设置开关/凭据时只报告 NOT VERIFIED，不伪造通过，
      # 也不会因为缺少外部备份凭据让整条 CI 失败。显式开启后才跑真实临时目录演练。
      - name: Restore drill (opt-in, NOT VERIFIED without credentials)
        env:
          BIDCRAFT_RESTORE_DRILL: ${{ vars.BIDCRAFT_RESTORE_DRILL || '' }}
          BIDCRAFT_RESTORE_DRILL_CREDENTIAL: ${{ secrets.BIDCRAFT_RESTORE_DRILL_CREDENTIAL || '' }}
        run: |
          set -euo pipefail
          if [ "${BIDCRAFT_RESTORE_DRILL:-}" != "1" ] || [ -z "${BIDCRAFT_RESTORE_DRILL_CREDENTIAL:-}" ]; then
            echo "RESTORE DRILL: NOT VERIFIED (opt-in var/credential not configured; no drill executed)"
            exit 0
          fi
          echo "RESTORE DRILL: running opt-in temporary-home drill (no production data)"
          BIDCRAFT_RESTORE_DRILL=1 uv run --frozen pytest -q -o addopts="" tests/test_fix3_backup_drill.py
          echo "RESTORE DRILL: VERIFIED"

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: /tmp/pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Failure summary
        if: failure()
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('/tmp/pytest-results.xml')
          if not path.is_file():
              print('pytest JUnit report not produced; see raw logs above.')
              raise SystemExit(0)
          root = ET.parse(path).getroot()
          failed = []
          for case in root.iter('testcase'):
              if case.find('failure') is not None or case.find('error') is not None:
                  failed.append(f"{case.get('classname')}::{case.get('name')}")
          print(f"FAILED TESTS ({len(failed)}):")
          for name in failed[:40]:
              print(" -", name)
          if len(failed) > 40:
              print(f" ... and {len(failed) - 40} more; full report in artifact pytest-junit")
          PY

  docker-image:
    name: docker (production image + compose hardening)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t bidcraft:v0340-check .

      - name: Image invariants (non-root, pg_dump, CLI, /health/live)
        run: |
          set -euo pipefail
          user=$(docker inspect -f '{{.Config.User}}' bidcraft:v0340-check)
          echo "Config.User=${user:-<empty>}"
          test -n "$user"
          test "$user" != root
          test "$user" != 0

          uid=$(docker run --rm --entrypoint id bidcraft:v0340-check -u)
          echo "runtime uid=$uid"
          test "$uid" != "0"

          health=$(docker inspect -f '{{json .Config.Healthcheck}}' bidcraft:v0340-check)
          echo "Healthcheck=$health"
          echo "$health" | grep -q '/health/live'

          docker run --rm --entrypoint sh bidcraft:v0340-check -c 'pg_dump --version'
          # CLI 没有 --version 选项；version 子命令同样验证 bidcraft 入口可执行。
          docker run --rm --entrypoint sh bidcraft:v0340-check -c 'bidcraft version'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Compose hardening (static parse)
        # 静态解析 compose：不启用 env_file、资源/权限限制与双探针路径齐全。
        run: |
          uv run --frozen python - <<'PY'
          import re
          from pathlib import Path

          import yaml

          text = Path("deploy/docker-compose.yml").read_text(encoding="utf-8")
          assert not re.search(r"^\s*env_file\s*:", text, re.M), "不得启用 env_file"
          service = yaml.safe_load(text)["services"]["bidcraft"]
          assert "env_file" not in service

          grace = service["stop_grace_period"]
          assert int(grace.rstrip("s")) >= 45, f"stop_grace_period 过短: {grace}"
          assert float(str(service["cpus"])) >= 2.0
          assert int(service["pids_limit"]) >= 256
          assert "ALL" in service["cap_drop"]
          assert any("no-new-privileges:true" in str(o) for o in service["security_opt"])

          probe = str(service["healthcheck"]["test"])
          assert "/health/live" in probe
          assert service["x-liveness-probe"]["httpGet"]["path"] == "/health/live"
          assert service["x-readiness-probe"]["httpGet"]["path"] == "/health/ready"

          # .env.example 中记录的生产变量必须显式透传；否则 BIDCRAFT_ENV 回退 dev、
          # PostgreSQL / 共享密钥 / 限流配置被静默忽略，形成生产配置漂移。
          required_env = {
              "BIDCRAFT_ADMIN_PASSWORD", "BIDCRAFT_SECURE_COOKIE", "BIDCRAFT_ENV",
              "BIDCRAFT_DB_URL", "BIDCRAFT_DOCS_ENABLED", "BIDCRAFT_TRUST_PROXY",
              "BIDCRAFT_PUBLIC_ORIGIN", "BIDCRAFT_SECRET_KEY", "BIDCRAFT_BACKUP_DIRS",
              "BIDCRAFT_RATE_LIMIT", "BIDCRAFT_RATE_WINDOW_SECONDS",
              "BIDCRAFT_RATE_LOGIN_IP", "BIDCRAFT_RATE_LOGIN_GLOBAL",
              "BIDCRAFT_RATE_SENSITIVE_IP", "BIDCRAFT_RATE_SENSITIVE_GLOBAL",
              "BIDCRAFT_LOG_LEVEL", "BIDCRAFT_LOG_FORMAT", "BIDCRAFT_KB_VECTOR_BATCH",
          }
          missing = sorted(required_env - set(service["environment"]))
          assert not missing, f"compose environment 缺少生产变量: {missing}"
          print("compose hardening OK (no env_file, limits, caps, live/ready probes, env passthrough)")
          PY

      - name: Compose real parse and live probe smoke
        # 静态 YAML 解析不足以验证插值/schema；这里用 docker compose 真解析并启动容器，
        # 轮询容器 health status 与 /health/live，确保镜像内 CMD 与 HEALTHCHECK 真能工作。
        run: |
          set -euo pipefail
          BIDCRAFT_ADMIN_PASSWORD=stage6-strong-pass \
            docker compose -f deploy/docker-compose.yml config -q
          docker rm -f bc-stage6-health >/dev/null 2>&1 || true
          # 仅用于启动配置校验：不连接任何真实模型服务；/health/live 不触发模型调用。
          docker run -d --name bc-stage6-health \
            -e BIDCRAFT_ADMIN_PASSWORD=stage6-strong-pass \
            -e BIDCRAFT_ENV=prod \
            -e BIDCRAFT_MODEL_BASE_URL=http://127.0.0.1:9/v1 \
            -e BIDCRAFT_MODEL_NAME=rc-smoke-model \
            -p 18000:8000 bidcraft:v0340-check
          healthy=0
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' bc-stage6-health 2>/dev/null || true)
            if [ "$status" = "healthy" ] && curl -fsS http://127.0.0.1:18000/health/live >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          docker logs bc-stage6-health || true
          docker rm -f bc-stage6-health >/dev/null 2>&1 || true
          test "$healthy" -eq 1 || { echo 'container /health/live smoke failed'; exit 1; }
          echo 'docker live probe OK'

      - name: Readiness probe smoke (/health/ready)
        # 就绪探针要查库且要求模型可用；离线模式豁免模型依赖，只验证 DB/web_dist 依赖真能被探测。
        run: |
          set -euo pipefail
          docker rm -f bc-stage8-ready >/dev/null 2>&1 || true
          docker run -d --name bc-stage8-ready \
            -e BIDCRAFT_ADMIN_PASSWORD=stage8-strong-pass \
            -e BIDCRAFT_ENV=prod \
            -e BIDCRAFT_OFFLINE=1 \
            -p 18001:8000 bidcraft:v0340-check
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18001/health/ready >/tmp/bc-ready.json 2>/dev/null; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/bc-ready.json').read_text(encoding='utf-8'))
          assert body.get('status') == 'ready', body
          assert body.get('db') == 'ok', body
          assert body.get('web_ready') is True, body
          print('ready payload:', body)
          PY
              ready=1
              break
            fi
            sleep 2
          done
          docker logs bc-stage8-ready || true
          test "$ready" -eq 1 || { echo 'container /health/ready smoke failed'; exit 1; }
          echo 'docker readiness probe OK'

      - name: Cleanup readiness probe container
        if: always()
        run: docker rm -f bc-stage8-ready >/dev/null 2>&1 || true

  web:
    name: web (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Environment info
        run: |
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH} image=${ImageOS:-unknown}"
          node --version
          npm --version

      - name: Install dependencies (locked)
        # 严格按锁文件安装：锁文件缺失或不一致直接失败，不允许回退到 npm install。
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build (tsc + vite)
        run: npm run build

  postgres:
    name: postgres (real integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 独立临时测试库，绝不连接真实业务数据库。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bidcraft
          POSTGRES_PASSWORD: bidcraft_test
          POSTGRES_DB: bidcraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidcraft -d bidcraft_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install PostgreSQL client tools
        # runner 本身需要 pg_dump，backup/restore 用例不能被环境静默跳过。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install Python
        run: uv python install 3.13

      - name: Sync dependencies (locked, with postgres)
        run: uv sync --frozen --python 3.13 --extra api --extra dev --extra postgres

      - name: Environment info
        run: |
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH} image=${ImageOS:-unknown}"
          uv --version
          pg_dump --version
          uv run --frozen python - <<'PY'
          import platform, sys
          import psycopg, sqlalchemy
          print("python", sys.version.split()[0], "psycopg", psycopg.__version__)
          print("sqlalchemy", sqlalchemy.__version__, "platform", platform.platform())
          PY
          pg_isready -h 127.0.0.1 -U bidcraft -d bidcraft_test || true

      - name: Test (real PostgreSQL integration)
        env:
          BIDCRAFT_TEST_PG_URL: postgresql+psycopg://bidcraft:bidcraft_test@127.0.0.1:5432/bidcraft_test
        run: |
          # 必须包含 tests/postgres/** 全部真实并发/迁移/权限用例，
          # 含历史 0013-0015 迁移往返与 v0.34.0 新增的 DB 并发用例；
          # 显式列出新文件，避免它被目录收集规则遗漏或只跑单个旧文件。
          uv run --frozen pytest -q --junitxml=/tmp/pg-results.xml \
            tests/postgres \
            tests/postgres/test_v032_migrations.py \
            tests/postgres/test_v0340_db_concurrency.py \
            tests/test_postgres_integration.py \
            tests/test_v030_pg_isolation.py \
            tests/test_worker_fencing_atomicity.py \
            tests/test_jobqueue_race_conditions.py
          uv run --frozen python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/pg-results.xml').getroot()
          suite = root.find('testsuite') if root.tag == 'testsuites' else root
          tests = int(suite.get('tests', 0))
          skipped = int(suite.get('skipped', 0))
          failures = int(suite.get('failures', 0)) + int(suite.get('errors', 0))
          # PG 测试不得因缺环境变量/工具而静默跳过：数量不足或有跳过都让 CI 失败。
          assert tests >= 900, f"PG 集成测试数量不足: {tests}（PG 套件未全部执行）"
          assert skipped == 0, f"PG 集成测试被跳过 {skipped} 项（环境/URL 缺失）"
          assert failures == 0, f"PG 集成测试失败 {failures} 项"
          # 新并发文件必须真的产生用例，不能只出现在命令行里。
          source_files = {
              (case.get('file') or case.get('classname') or '')
              for case in root.iter('testcase')
          }
          normalized = {
              name.replace('.py', '').replace('/', '.').replace('\\', '.')
              for name in source_files
          }
          assert any(name.endswith('test_v0340_db_concurrency') for name in normalized), (
              "v0.34.0 DB 并发用例未进入 JUnit 报告"
          )
          print(f"PG integration OK: {tests} tests, 0 skipped")
          PY

      - name: Upload PostgreSQL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-junit
          path: /tmp/pg-results.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: PostgreSQL failure summary
        if: failure()
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('/tmp/pg-results.xml')
          if not path.is_file():
              print('PostgreSQL JUnit report not produced; see raw logs above.')
              raise SystemExit(0)
          root = ET.parse(path).getroot()
          failed = [
              f"{case.get('classname')}::{case.get('name')}"
              for case in root.iter('testcase')
              if case.find('failure') is not None or case.find('error') is not None
          ]
          print(f"FAILED POSTGRES TESTS ({len(failed)}):")
          for name in failed[:40]:
              print(" -", name)
          PY

  docx-render:
    name: docx (CJK render + fidelity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install rendering toolchain and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk libreoffice-writer poppler-utils

      - name: Map Windows tender fonts to Noto CJK
        # 不降低测试门槛：让 CI 的 fontconfig 与生产部署建议一致，
        # 使宋体/黑体/仿宋/雅黑在 Linux 上真正确解析为 CJK 字体。
        run: |
          sudo tee /etc/fonts/conf.d/99-bidcraft-cjk.conf >/dev/null <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match target="pattern">
              <test name="family" compare="eq"><string>宋体</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
            </match>
            <match target="pattern">
              <test name="family" compare="eq"><string>黑体</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
            </match>
            <match target="pattern">
              <test name="family" compare="eq"><string>仿宋_GB2312</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
            </match>
            <match target="pattern">
              <test name="family" compare="eq"><string>微软雅黑</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
            </match>
          </fontconfig>
          XML
          sudo fc-cache -f

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Sync dependencies (locked)
        run: uv sync --frozen --python 3.13 --extra api --extra dev

      - name: Environment info
        run: |
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH} image=${ImageOS:-unknown}"
          fc-list :lang=zh family | head -5
          soffice --version
          pdfinfo -v 2>&1 | head -2
          uv run --frozen python --version

      - name: DOCX renderer / golden tests (strict, no skip)
        env:
          BIDCRAFT_DOCX_REQUIRE_RENDER: "1"
        run: |
          uv run --frozen pytest -q --junitxml=/tmp/docx-results.xml \
            tests/test_docx_renderer.py tests/test_docx_validator.py \
            tests/test_batch4_export_engine.py tests/test_batch4_golden.py
          uv run --frozen python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/docx-results.xml').getroot()
          suite = root.find('testsuite') if root.tag == 'testsuites' else root
          skipped = int(suite.get('skipped', 0))
          failures = int(suite.get('failures', 0)) + int(suite.get('errors', 0))
          assert skipped == 0, f"DOCX 渲染 job 不允许跳过用例，实际跳过 {skipped}"
          assert failures == 0, f"DOCX 渲染 job 有 {failures} 个失败"
          print(f"docx render OK: {suite.get('tests')} tests, 0 skipped")
          PY

      - name: Upload DOCX report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docx-junit
          path: /tmp/docx-results.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: DOCX failure summary
        if: failure()
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('/tmp/docx-results.xml')
          if not path.is_file():
              print('DOCX JUnit report not produced; see raw logs above.')
              raise SystemExit(0)
          root = ET.parse(path).getroot()
          for case in root.iter('testcase'):
              skip = case.find('skipped')
              failure = case.find('failure') or case.find('error')
              if skip is not None or failure is not None:
                  state = 'SKIPPED' if skip is not None else 'FAILED'
                  print(f"{state}: {case.get('classname')}::{case.get('name')}")
          PY

  # ---------------------------------------------------------------------------
  # 以下安全作业为强制门禁：v0.32.0 发版前依赖审计、SAST、密钥扫描必须全部通过。
  # 明确豁免只允许写进 scripts/bandit_gate.py / .gitleaksignore 等可审查清单，
  # 不再用 continue-on-error 或 || true 隐藏失败。
  # ---------------------------------------------------------------------------
  security-dependency-audit:
    name: security (dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Export locked Python requirements
        run: uv export --frozen --format requirements-txt --no-emit-project --extra api --extra postgres -o /tmp/bc-requirements.txt
      - name: pip-audit (Python)
        run: uvx --from pip-audit pip-audit -r /tmp/bc-requirements.txt --progress-spinner off
      - name: npm audit (production dependencies, lockfile only)
        # 构建产物只依赖 dependencies；devDependencies 的漏洞另做提示，不作为发版门禁。
        working-directory: web
        run: npm audit --omit=dev --package-lock-only --audit-level=high

      - name: npm audit (full tree)
        working-directory: web
        run: npm audit --package-lock-only --audit-level=high

  security-sast:
    name: security (bandit SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Bandit (medium+ severity)
        # 全量扫描 bidcraft，不再按目录排除 Alembic 迁移：迁移里的 B608 是审查过的静态 DDL，
        # 由门禁脚本按 (文件, 行号, 规则) 精确豁免；业务代码中的受控 SQL/eval 已就地 #nosec 并注释理由。
        # 阈值仍为 -ll（中/高危），门禁脚本内部也只判定 MEDIUM/HIGH，不放宽级别。
        # bandit 发现问题时退出码为 1（报告已落盘）；扫描自身出错（>1）直接失败。
        run: |
          set +e
          uvx --from bandit bandit -q -ll -f json -r bidcraft -o /tmp/bandit.json
          bandit_code=$?
          set -e
          if [ "$bandit_code" -gt 1 ]; then
            echo "Bandit 扫描失败（退出码 $bandit_code）"
            exit "$bandit_code"
          fi
          uv run --frozen python scripts/bandit_gate.py /tmp/bandit.json

  security-secret-scan:
    name: security (secret scanning)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v2 在 2026-09 后从 GitHub hosted runner 移除；v3 仅迁移 Node 24 运行时，行为不变。
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # gitleaks 需要完整历史
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
