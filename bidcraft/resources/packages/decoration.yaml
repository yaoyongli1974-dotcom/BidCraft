# 装饰装修 · 材料 / 地面墙面吊顶 / 门窗隔断 / 环保验收
package: decoration
version: 1
project_type: decoration
project_type_label: 装饰装修
title: 装饰装修技术标
description: 装饰范围、材料标准、地面墙面吊顶、门窗隔断与环保验收的解析项、章节骨架与核对规则。
extends: [common-bid-facts]

parse:
  keywords: [装饰, 装修, 精装修, 地面, 墙面, 吊顶, 石材, 瓷砖, 涂料, 木饰面, 门窗, 隔断, 软装, 环保, 甲醛]
  parameter_vocab:
    - 装饰装修
    - 地面
    - 墙面
    - 吊顶
    - 石材
    - 瓷砖
    - 涂料
    - 木饰面
    - 门窗
    - 隔断
    - 五金
    - 环保
    - 甲醛
    - 防火
    - GB 50210
    - GB 50325
  table_hints:
    materials: [工程量清单, 装饰材料清单, 材料表, 设备材料表]
    parameters: [技术参数, 技术规格, 材料要求, 质量要求]

fields:
  - key: decoration.scope
    label: 装饰装修范围
    group: technical
    aliases: [装饰范围, 装修范围, 精装修范围, 招标范围]
    required: true
    type: text
  - key: decoration.area
    label: 装饰面积
    group: technical
    aliases: [装饰面积, 装修面积, 建筑面积, 施工面积]
    required: true
    type: number
    unit: ㎡
  - key: decoration.standard
    label: 装饰标准
    group: technical
    aliases: [装饰标准, 装修标准, 材料标准, 品质标准]
    required: true
    type: text
  - key: decoration.main_materials
    label: 主要装饰材料
    group: technical
    aliases: [主要材料, 装饰材料, 材料品牌, 材料规格]
    required: false
    type: text
  - key: decoration.fire_rating
    label: 材料防火等级
    group: technical
    aliases: [防火等级, 燃烧性能, 材料防火, 防火要求]
    required: false
    type: text
  - key: decoration.environment_standard
    label: 室内环境标准
    group: technical
    aliases: [环保标准, 室内环境, 甲醛检测, 环境验收]
    required: false
    type: text
  - key: decoration.warranty_years
    label: 装饰工程质保年限
    group: commercial
    aliases: [质保年限, 质保期, 保修期, 装饰质保]
    required: false
    type: duration

outline:
  mode: replace
  items:
    - {heading: 项目理解与装饰需求分析, intent: 引用项目身份、装饰范围、面积与品质目标，说明对招标文件的理解, target_words: 2200, needs: [project.name, decoration.scope, decoration.area]}
    - {heading: 商务条款响应与承诺, intent: 逐项响应工期、质保、投标有效期、付款与验收条款, target_words: 1800, needs: [project.duration, project.warranty, project.bid_validity, project.payment]}
    - {heading: 实质性条款与废标风险响应, intent: 对照装饰工程否决项、资质与样品要求，说明响应措施与责任分工, target_words: 1800, needs: [project.name, qualification.requirements]}
    - {heading: 设计理念与效果呈现, intent: 空间风格、色彩材质、灯光与细部节点，说明与招标意图的一致性, target_words: 2600, needs: [decoration.scope, decoration.standard]}
    - {heading: 装饰材料选型与样品管理, intent: 材料品牌、规格、环保与防火等级，样品报审与封样, target_words: 3200, needs: [decoration.main_materials, decoration.fire_rating, decoration.environment_standard]}
    - {heading: 地面工程施工, intent: 基层处理、找平、石材/瓷砖/地毯/木地板铺装与成品保护, target_words: 3000, needs: [decoration.main_materials, decoration.standard]}
    - {heading: 墙面与柱面施工, intent: 基层、涂饰、壁纸、木饰面、石材干挂与收口, target_words: 3200, needs: [decoration.main_materials, decoration.standard]}
    - {heading: 吊顶与隔断施工, intent: 龙骨、面板、检修口、隔断与门窗安装, target_words: 3000, needs: [decoration.scope, decoration.main_materials]}
    - {heading: 水电末端与设备收口, intent: 灯具、开关插座、风口、喷淋与装饰面协调, target_words: 2400, needs: [decoration.scope]}
    - {heading: 施工组织与穿插配合, intent: 施工顺序、样板引路、各专业穿插与工期节点, target_words: 2800, needs: [project.duration, decoration.area]}
    - {heading: 质量环保与验收, intent: 过程质量控制、环保检测、防火检测与竣工验收, target_words: 2600, needs: [decoration.environment_standard, decoration.standard]}
    - {heading: 安全文明施工与售后服务, intent: 现场安全、成品保护、质保响应与回访, target_words: 1800, needs: [decoration.warranty_years, project.warranty]}

checks:
  - id: DEC-001
    level: major
    category: 参数响应
    assert: "not parameters or param_response_ratio(parameters, doc) >= 0.95"
    message: 装饰材料/技术参数未逐条响应（响应率低于 95%）
    recommendation: 在材料与技术参数响应表中逐条列出规格、品牌与偏离说明
  - id: DEC-002
    level: major
    category: 材料
    assert: "not present(facts['decoration.fire_rating']) or contains(doc, facts['decoration.fire_rating'])"
    message: 正文未响应装饰材料的防火等级要求
    recommendation: 在材料选型章节写明燃烧性能等级与检测报告
  - id: DEC-003
    level: major
    category: 环保
    assert: "not present(facts['decoration.environment_standard']) or contains(doc, facts['decoration.environment_standard'])"
    message: 正文未引用室内环境/环保验收标准
    recommendation: 在质量环保章节写明甲醛、TVOC 检测与验收要求
  - id: DEC-004
    level: minor
    category: 完整性
    assert: "contains_ratio(doc, ['地面', '墙面', '吊顶', '门窗']) >= 0.75"
    message: 装饰分项覆盖不足
    recommendation: 按招标范围补齐地面、墙面、吊顶与门窗隔断内容
