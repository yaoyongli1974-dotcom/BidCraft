# nfpm 配置：同时产出 .deb 与 .rpm（https://nfpm.goreleaser.com）
#
#   VERSION=0.6.0 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb -t dist/
#   VERSION=0.6.0 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
name: bidcraft-desktop
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: office
priority: optional
maintainer: BidCraft <noreply@bidcraft.local>
description: |
  BidCraft desktop client (C/S mode).
  Local gateway that proxies a BidCraft server and exposes a local file bridge.
vendor: BidCraft
license: Proprietary
contents:
  - src: dist/BidCraft
    dst: /opt/bidcraft
  - src: packaging/bidcraft-desktop.sh
    dst: /usr/bin/bidcraft-desktop
    file_info:
      mode: 0755
  - src: packaging/bidcraft.desktop
    dst: /usr/share/applications/bidcraft.desktop
  - src: packaging/bidcraft.svg
    dst: /usr/share/icons/hicolor/scalable/apps/bidcraft.svg
